name: Workbench checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _workbench/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: _workbench/requirements.txt
      - run: npm ci --ignore-scripts
        working-directory: _workbench
      - run: python -m pip install -r _workbench/requirements.txt
      - run: python _workbench/setup_ocr.py
      - run: npm test
        working-directory: _workbench
      - run: python -m unittest discover -s _workbench/tests -p '*_test.py'
        env:
          QLIST_INDEX_AI: '0'
